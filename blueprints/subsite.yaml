title: Subsite Options
'@extends':
    type: default
    context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
            fields:
                header.title:
                  replace@: true
                  type: text
                  size: small
                  label: Subsite Title

                header.subsite_list_title:
                  ordering@: 2
                  replace@: true
                  type: text
                  size: medium
                  label: Subsite List Title
                  description: If empty, Subsite Title is displayed.

                header.subsite_list_description:
                  ordering@: 3
                  replace@: true
                  type: text
                  size: long
                  label: Subsite List Description

                header.instructor:
                  ordering@: header.subsite_list_description
                  type: text
                  size: long
                  label: Instructor(s)
                  placeholder: 'e.g. Instructor: Jane Smith'
                  help: Optional line shown below the description on the course card. Uses the same field as Grav Helios Course Hub, so it carries over unchanged.

                header.image:
                  ordering@: header.instructor
                  type: pagemediaselect
                  label: Course Card Image
                  help: Optional image from this page's media for the course card. If empty, the course's header image is used. Uses the same field as Grav Helios Course Hub, so it carries over unchanged.

                header.badge_label:
                  ordering@: header.image
                  type: text
                  size: medium
                  label: Badge Label
                  placeholder: 'e.g. Coming Soon, New, Archived'
                  help: Optional status badge shown on the course card. Uses the same field as Grav Helios Course Hub, so it carries over unchanged.

                header.badge_color:
                  ordering@: header.badge_label
                  type: select
                  label: Badge Color
                  default: default
                  options:
                    default: Default
                    blue: Blue
                    green: Green
                    yellow: Yellow
                    red: Red
                    purple: Purple
                    plain: Plain
                  help: Badge colours match Grav Helios Course Hub, shown with the closest Bootstrap badge style.

                header.group:
                  ordering@: header.badge_color
                  type: text
                  size: medium
                  label: Course List Group
                  placeholder: 'e.g. Current Courses'
                  help: Optional group heading for this course on the Subsite List page. Courses without a group appear first, with no heading. Uses the same field as Grav Helios Course Hub, so it carries over unchanged.

                header.hide_from_subsite_list:
                    ordering@: 4
                    type: toggle
                    label: Display this Item in Subsite List
                    help: Determines if this page (i.e. subsite) will appear in the subsite list
                    default: 0
                    highlight: 0
                    options:
                        0:  Yes
                        1:  No
                    validate:
                        type: bool

                header.subsite_home:
                    ordering@: 5
                    type: text
                    size: small
                    label: Subsite Home Page
                    default: 'home'
                    validate:
                      required: true

                header.navbar_bg_color:
                    ordering@: 6
                    type: colorpicker
                    label: 'Subsite NavBar Background Color'
                    description: "If set, will be used for Subsite's NavBar Background."
                    size: small

        options:
          fields:
            publishing:
              fields:
                header.published:
                  default: 1

        advanced:
          fields:
            overrides:
              fields:
                header.visible:
                  default: 0
